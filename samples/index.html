<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Samples — CBenton</title>
  <meta name="description" content="Visual project index: one card per parent project, with variants and instances contained inside each canonical project page." />
  <link rel="canonical" href="https://cbenton.art/samples" />
  <meta property="og:title" content="Samples — CBenton" />
  <meta property="og:description" content="Visual index of project families." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cbenton.art/samples" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" role="banner"></header>

  <main id="main" class="container" role="main">
    <h1>Samples</h1>
    <p class="prose">Visual index with one card per parent project. Variants, player instances, and additional detail assets are contained inside each project page.</p>
    <div id="samples-grid" class="grid section"></div>
  </main>

  <footer class="site-footer" role="contentinfo"></footer>
  <script src="/nav.js" defer></script>
  <script>
    function createEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    async function renderSamples() {
      const grid = document.getElementById('samples-grid');
      const res = await fetch('/data/project-registry.json');
      const projects = await res.json();
      projects.filter((p) => p.visibleInSamples).forEach((p) => {
        const marker = (p.assets || []).filter((a) => a.path.endsWith('.png')).length;
        const article = createEl('article', 'card');
        const link = createEl('a', 'card-link');
        link.href = `/projects/${p.slug}`;
        const img = createEl('img');
        img.src = `/${p.hero}`;
        img.alt = `${p.title} representative visual`;
        img.loading = 'lazy';
        const content = createEl('div', 'card-content');
        const h2 = createEl('h2', null, p.title);
        const type = createEl('p', 'muted', p.projectType);
        const count = createEl('p', 'muted', `${marker} visual asset${marker === 1 ? '' : 's'}`);
        content.append(h2, type, count);
        link.append(img, content);
        article.appendChild(link);
        grid.appendChild(article);
      });
    }
    renderSamples();
  </script>
</body>
</html>
