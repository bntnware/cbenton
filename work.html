<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selected Work — CBenton</title>
  <meta name="description" content="Curated case-study index of CBenton visual systems, showing project logic, scope, and outputs." />
  <link rel="canonical" href="https://cbenton.art/work" />
  <meta property="og:title" content="Selected Work — CBenton" />
  <meta property="og:description" content="Curated systems-focused case studies." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cbenton.art/work" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" role="banner"></header>

  <main id="main" class="container" role="main">
    <h1>Work</h1>
    <p class="prose">Curated portfolio case studies. This index prioritizes system logic, why the project matters, scope, and production outputs.</p>
    <div id="work-grid" class="grid section"></div>
  </main>

  <footer class="site-footer" role="contentinfo"></footer>
  <script src="/nav.js" defer></script>
  <script>
    function createEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    async function renderWork() {
      const grid = document.getElementById('work-grid');
      try {
        const res = await fetch('/data/project-registry.json');
        if (!res.ok) throw new Error('Registry request failed');
        const projects = await res.json();
        projects.filter((p) => p.featuredInWork).forEach((p) => {
          const scope = (p.outputs || []).join(', ');
          const article = createEl('article', 'card');
          const link = createEl('a', 'card-link');
          link.href = `/projects/${p.slug}`;
          link.setAttribute('aria-label', `View project: ${p.title}`);
          const img = createEl('img');
          img.src = `/${p.hero}`;
          img.alt = p.heroAlt || p.summary || p.title;
          img.loading = 'lazy';

          const content = createEl('div', 'card-content');
          const h2 = createEl('h2', null, p.title);
          const type = createEl('p', 'muted', p.projectType);
          const summary = createEl('p', 'muted', p.summary);
          const why = createEl('p', 'muted', `Why it matters: ${(p.problem || p.systemDescription || '').slice(0, 170)}`);
          const outputs = createEl('p', 'muted', `Scope / outputs: ${scope || 'Project system outputs'}`);

          content.append(h2, type, summary, why, outputs);
          link.append(img, content);
          article.appendChild(link);
          grid.appendChild(article);
        });
      } catch (err) {
        grid.appendChild(createEl('p', 'muted', 'Work projects could not be loaded right now. Please retry shortly.'));
      }
    }
    renderWork();
  </script>
</body>
</html>
