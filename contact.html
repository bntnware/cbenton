<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — CBenton</title>
  <meta name="description" content="Contact CBenton for project inquiries and system-based design engagements." />
  <link rel="canonical" href="https://cbenton.art/contact" />
  <meta property="og:title" content="Contact — CBenton" />
  <meta property="og:description" content="Project inquiry and engagement contact." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cbenton.art/contact" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" role="banner"></header>
  <main id="main" class="container" role="main">
    <h1>Contact</h1>
    <p class="prose">Share your project scope, timeline, and context. Replies are typically sent within three business days.</p>

    <form class="section" action="https://formsubmit.co/chrisbenton@outlook.com" method="POST">
      <input type="hidden" name="_next" value="/thank-you.html" />
      <input type="hidden" name="_captcha" value="false" />
      <label for="fax" style="position:absolute;left:-9999px;">Leave this field empty</label>
      <input id="fax" name="fax" type="text" style="position:absolute;left:-9999px;" tabindex="-1" autocomplete="off" />
      <p><label for="name">Name *</label><br /><input id="name" name="name" required /></p>
      <p><label for="email">Email *</label><br /><input id="email" name="email" type="email" required /></p>
      <p><label for="project-type">Project type</label><br />
        <select id="project-type" name="project-type">
          <option value="focused">Focused Project</option>
          <option value="campaign">Campaign System</option>
          <option value="serialized">Serialized / Variable Edition System</option>
          <option value="publication">Publication / Document System</option>
          <option value="workflow">Workflow Integration / Consulting</option>
          <option value="small">Selective Small Project</option>
        </select>
      </p>
      <p><label for="timeline">Timeline</label><br /><input id="timeline" name="timeline" /></p>
      <p><label for="message">Message *</label><br /><textarea id="message" name="message" rows="6" required></textarea></p>
      <p><button class="btn btn-primary" type="submit">Send inquiry</button></p>
      <p class="muted">Do not include sensitive personal information in this form.</p>
    </form>
  </main>
  <footer class="site-footer" role="contentinfo"></footer>
  <script src="/nav.js" defer></script>
</body>
</html>
